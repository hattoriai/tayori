name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The entries in the database are tested on SQLite and on PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Erlang and Elixir exactly as in .tool-versions.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # All environments: credo and the tests run in :test, ex_doc and
      # dialyxir in :dev.
      - run: mix deps.get

      # The bundles are built only for a release. Empty files let the
      # package compile and the tests run without Node.js; the tests that
      # need the real bundle are tagged :build, and the e2e job builds.
      - name: Seed fake assets
        run: |
          mkdir -p priv/static
          touch priv/static/tayori.esm.js priv/static/tayori.cjs.js priv/static/tayori.css priv/static/tayori-sumi.css priv/static/tayori-admin.js priv/static/tayori-admin.css

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - run: mix credo --strict
        env:
          MIX_ENV: test

      - run: mix docs
        env:
          MIX_ENV: dev

      - run: mix test --exclude build
        env:
          MIX_ENV: test

      - run: mix dialyzer
        env:
          MIX_ENV: dev

  # The lowest Elixir that mix.exs accepts (~> 1.18, for the built-in JSON
  # module), with the lowest Phoenix (1.7) and LiveView (1.1) that it
  # accepts (TAYORI_OLDEST), so that the floors stay true. Format, credo,
  # docs and dialyzer run only in the test job. OTP 27.2.2, not 27.2: before it,
  # public_key refused a CA certificate with the serverAuth extended key
  # usage, as in the chain of builds.hex.pm, so setup-beam could not
  # install Rebar or Hex.
  floor:
    runs-on: ubuntu-latest

    env:
      TAYORI_OLDEST: "1"

    # The entries in the database are tested on SQLite and on PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18.3"
          otp-version: "27.2.2"
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-oldest-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-oldest-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Seed fake assets
        run: |
          mkdir -p priv/static
          touch priv/static/tayori.esm.js priv/static/tayori.cjs.js priv/static/tayori.css priv/static/tayori-sumi.css priv/static/tayori-admin.js priv/static/tayori-admin.css

      # mix.lock has the newest Phoenix and LiveView: resolve the oldest.
      - run: mix deps.update phoenix phoenix_live_view

      - run: mix deps.get

      # --force: a _build restored from an older lock may hold modules
      # compiled without an optional dependency (Tayori.MCP without Sake),
      # and Mix does not know to compile them again.
      - run: mix compile --warnings-as-errors --force
        env:
          MIX_ENV: test

      - run: mix test --exclude build
        env:
          MIX_ENV: test

  # The unit tests of the TypeScript modules, and the type check.
  js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The typecheck reads the types LiveView and PhoenixMountable ship,
      # from deps/ (assets/tsconfig.json): fetched, not compiled.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - uses: actions/cache@v4
        with:
          path: deps
          key: mix-js-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: npm ci
        working-directory: assets

      - run: npm run typecheck
        working-directory: assets

      - run: npm test
        working-directory: assets

  # One job for each browser engine. The Chromium job keeps the name "e2e".
  #
  # In Playwright's own image, whose browsers and their system packages are
  # in it already: installing WebKit's packages from Ubuntu's mirrors took
  # from a minute to half an hour (as in Issho). Erlang and Elixir come from
  # hex.pm's builds for Ubuntu 24.04 (the image's), so nothing comes from apt.
  e2e:
    name: ${{ matrix.browser == 'chromium' && 'e2e' || format('e2e ({0})', matrix.browser) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Its version is e2e/package-lock.json's @playwright/test.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      # Firefox, run as root, wants its own home.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Erlang and Elixir, as in .tool-versions
        id: beam
        run: |
          otp=$(awk '$1 == "erlang" { print $2 }' .tool-versions)
          elixir=$(awk '$1 == "elixir" { print $2 }' .tool-versions)
          mkdir -p /opt/beam/elixir
          curl -fsSL "https://builds.hex.pm/builds/otp/amd64/ubuntu-24.04/OTP-$otp.tar.gz" | tar xz -C /opt/beam
          (cd "/opt/beam/OTP-$otp" && ./Install -minimal "/opt/beam/OTP-$otp" > /dev/null)
          curl -fsSL -o /tmp/elixir.zip "https://builds.hex.pm/builds/elixir/v$elixir.zip"
          npx --yes extract-zip@2.0.1 /tmp/elixir.zip /opt/beam/elixir
          echo "/opt/beam/OTP-$otp/bin" >> "$GITHUB_PATH"
          echo "/opt/beam/elixir/bin" >> "$GITHUB_PATH"
          echo "otp=$otp" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - run: mix local.hex --force && mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-e2e-image-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-e2e-image-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-

      - run: mix deps.get

      - run: npm ci
        working-directory: assets

      - run: npm ci
        working-directory: e2e

      # The Playwright web server runs `mix tayori.build` (the real bundle)
      # and starts `mix dev` without watchers.
      - run: mix test.e2e
        env:
          CI: "true"
          E2E_BROWSERS: ${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
